        @media (max-width: 600px) {

        // Curated homepage selection
        const homepageSelection = [
            "./NEWCOIN LIFE/hf_20260212_214809_5a8ff489-c0ee-444d-af8f-46d36b5dff28.jpg",
            "./2. SAMUEL SLATTERY/hf_20260401_164601_ae6b11ae-524b-43de-9e29-6addcce3df05.jpg",

            "./NEWCOIN LIFE/hf_20260331_190706_f9657a94-53be-47bd-b99c-21bec76cf594.jpg",
        ];

        const carouselContainer = document.getElementById('carousel');
        const slideDuration = 4000; // time per slide in ms
        let carouselInterval;

        function renderCarousel(imageSet) {
            // Clear existing
            clearInterval(carouselInterval);
            carouselContainer.innerHTML = '';
            
            if (!imageSet || imageSet.length === 0) return;

            // Shuffle a copy
            const shuffled = [...imageSet];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }

            // Create div elements
            shuffled.forEach((src, idx) => {
                const div = document.createElement('div');
                div.style.backgroundImage = `url('${src}')`;
                div.classList.add('carousel-item');
                if (idx === 0) div.classList.add('active');
                carouselContainer.appendChild(div);
            });

            const imageElements = carouselContainer.querySelectorAll('.carousel-item');
            let currentIndex = 0;

            if (imageElements.length > 1) {
                carouselInterval = setInterval(() => {
                    imageElements[currentIndex].classList.remove('active');
                    currentIndex = (currentIndex + 1) % imageElements.length;
                    imageElements[currentIndex].classList.add('active');
                }, slideDuration);
            }
        }

        // Initialize with curated homepage selection
        renderCarousel(homepageSelection);

        // Sidebar filtering
        document.querySelectorAll('.portfolio-link').forEach(link => {
            link.addEventListener('click', (e) => {
                e.preventDefault();
                const folder = e.target.getAttribute('data-folder');
                if (folder === 'all') {
                    renderCarousel(homepageSelection);
                } else {
                    renderCarousel(images.filter(src => src.includes(`/${folder}/`)));
                }
            });
        });

        // Portfolio menu toggle
        const portfolioToggle = document.getElementById('portfolio-toggle');
        const portfolioList = document.getElementById('portfolio-list');
        const toggleIcon = document.getElementById('toggle-icon');

        if (portfolioToggle) {
            portfolioToggle.addEventListener('click', () => {
                if (portfolioList.style.display === 'none') {
                    portfolioList.style.display = 'block';
                    toggleIcon.textContent = '-';
                } else {
                    portfolioList.style.display = 'none';
                    toggleIcon.textContent = '+';
                }
            });
        }
